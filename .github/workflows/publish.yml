name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for npm OIDC trusted publishing
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Syntax check
        shell: bash
        run: |
          node --check bin/cli.js
          node --check src/server.js
          node --check src/paths.js
          node --check public/game.js
      - name: Smoke test (CLI + installer in a throwaway home)
        shell: bash
        env:
          QUIZ_DEV_HOME: ${{ runner.temp }}/quiz-dev-home
        run: |
          node bin/cli.js --version
          node bin/cli.js config

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds

      - name: Tag must match package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($PKG)"; exit 1
          fi

      # No dependencies and no lockfile, so no `npm ci` / build / test steps.
      - run: npm pack --dry-run
      - run: npm publish --access public
